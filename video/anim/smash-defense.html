  画面只由 window.render(t) 决定（t = 秒），没有 CSS 动画、没有随机数，逐帧截图每次都一样。
  window.setup(spec, lang) 先把文字放好（spec = video/scripts/smash-defense.json）。
  球场按比例画在“米”坐标里：原点 = 网的中点，x 向右、y 向我方为正。
  镜头 = (cx, cy, s)：把 (cx, cy) 米放在屏幕 (540, 857)，每米 s 像素。点和线的粗细随镜头轻微变大，
  位置、距离、球拍长度都按真实比例。
  镜头、球场、球、勾叉、文字排版这些和别的站位题共用的代码在 common.js；这里只写这一集的场景。
-->

<script>
'use strict';
// ---- 镜头（每个镜头都让动作停在字幕上面：字幕永远紧贴在焦点下面）----
// v4：球场铺满画面。全场 116 px/米（宽 708 px），从顶栏下面一直到底（我方底线 y≈1764，外面接场边地面）；
// 字幕在全场时压在我方前场上（网和我之间），在半场、近景时压在我方后场上（人和落点在字幕上面）
const FULL = { cx: 0, cy: -0.605, s: 116 };   // 远端底线 y≈150，对手 y≈301，网 y≈927，我 y≈1345，落点 y≈1484
const HALF = { cx: 0, cy: 2.456, s: 160 };    // 网 y≈464，我 y≈1040，底线 y≈1536，下面是场边地面
const CLOSE = { cx: -0.9, cy: 3.05, s: 260 }; // 我 y≈1000，底线 y≈1806
const CAP_TOP = { full: 1030, near: 1170 };   // 字幕顶边：全场 / 半场和近景，镜头推拉时跟着走

// ---- 位置（米）----
const H = [-1.9, -5.4];
const HALFSTEP = 0.45;                                   // 半步，按真实比例
const A = [-HALFSTEP, 3.6], B = [0, 3.6], C = [HALFSTEP, 3.6];  // A 往直线那边，B 中间，C 往斜线那边
const LS = [-2.0, 4.8], LC = [2.0, 4.8];                 // 直线、斜线杀球落点
const RK = 0.62;                                         // 拍面中心离身体中心（米）
const LEN_S = dist(H, LS), LEN_C = dist(H, LC);
const T_S = tOf(LEN_S), T_C = tOf(LEN_C);
const F_INT = (3.6 - H[1]) / (LS[1] - H[1]);            // 两条线在 y = 3.6（我站的深度）的位置
const IS = lerp2(H, LS, F_INT), IC = lerp2(H, LC, F_INT);
const T_IS = tOf(F_INT * LEN_S), T_IC = tOf(F_INT * LEN_C);
const LUNGE = [IS[0] + RK, 3.6], STEP = [IC[0] - RK, 3.6];
const FACE_H = angW(A, H);

// ---- 时间点（秒）。镜头移动都在两小节的网格上落地（强拍在奇数秒），而且不和第一次出现的字重叠 ----
const T = {
  lobEnd: 1.0, opt: [1.2, 1.333, 1.467], title: 0.3,
  drawS: [5.7, 6.3], drawC: [6.0, 6.6],
  race: 7.6, freeze: 0.8,
  reach: 11.3, compare: [12.9, 13.6], reveal: 15.0,
  moveA: [16.8, 17.4], turnA: [17.3, 17.7], racket: 17.8,
  sm1: 19.9, sm2: 23.6, slow: 0.5,
  missCard: 27.0, backB: [27.2, 27.8], sm3: 28.9, rule: 31.0,
  end: 36.3, loop: 37.6, dur: 38.0,
};
T.raceLandS = T.race + T_S / T.slow;
T.raceResume = T.raceLandS + T.freeze;
T.raceLandC = T.raceResume + (T_C - T_S) / T.slow;
T.hit1 = T.sm1 + T_IS / T.slow;
T.hit2 = T.sm2 + T_IC / T.slow;
T.land3 = T.sm3 + T_S;
// 镜头：[开始, 结束, 从, 到]，0.8 秒 ease-in-out
const MOVES = [
  [10.2, 11.0, FULL, HALF],    // 推到我方半场：从中间够两条线
  [18.2, 19.0, HALF, CLOSE],   // 再推近：身体对着他、拍子放直线那边
  [22.2, 23.0, CLOSE, HALF],   // 拉回半场：斜线
  [26.2, 27.0, HALF, FULL],    // 拉回全场：站中间、真实速度
];
window.TIMES = T;

// ---- 选项圈 ----
const opts = {};
function buildOpts() {
  const g = $('opts');
  for (const [k, p] of [['A', A], ['B', B], ['C', C]]) {
    const o = el('g', {}, g);
    const ring = el('circle', { cx: 0, cy: 0, r: 15, fill: 'none', 'stroke-width': 3, 'stroke-dasharray': '6 5' }, o);
    const txt = el('text', { x: 0, y: 45, 'text-anchor': 'middle', 'font-family': 'BLAB', 'font-weight': 700, 'font-size': 25 }, o);
    txt.textContent = k;
    opts[k] = { g: o, ring, txt, p };
  }
}
let M = {};
function buildMarks() {
  M = { okA: mark('ok', LIME, 11), noB: mark('no', WARM, 9), noC: mark('no', WARM, 11),
        ok1: mark('ok', LIME, 15), ok2: mark('ok', LIME, 15), miss: mark('no', WARM, 17) };
}

// ---- 球 ----
function shuttle1(t) {
  if (t >= T.loop) t = 0;
  const atH = (op = 1) => ({ p: H, h: 2.8, fly: false, op });
  if (t < T.lobEnd) {                                        // 我们挑过去的高球，快到他头上，几乎垂直往下掉
    const k = t / T.lobEnd;
    return { p: lerp2([H[0] + 0.12, H[1] + 0.3], H, k), h: lerp(4.2, 2.8, k), fly: true, op: 1 };
  }
  if (t < T.race) return atH();
  if (t < 11.0) {
    const real = t < T.raceLandS ? (t - T.race) * T.slow : T_S;
    return { ...smashAt(H, LS, real, LEN_S), op: 1 - tw(t, 10.0, 10.3, lin) };
  }
  if (t < T.sm1) return atH(tw(t, 18.0, 18.3));
  if (t < T.sm2 - 0.6) {
    if (t < T.hit1) return { ...smashAt(H, LS, (t - T.sm1) * T.slow, LEN_S), op: 1 };
    const k = clamp01((t - T.hit1) / 0.8);
    return { ...blockAt(IS, smashH(F_INT), [-1.4, -1.2], k), op: 1 - tw(t, T.hit1 + 0.7, T.hit1 + 1.0, lin) };
  }
  if (t < T.sm2) return atH(tw(t, T.sm2 - 0.6, T.sm2 - 0.4));
  if (t < T.missCard) {
    if (t < T.hit2) return { ...smashAt(H, LC, (t - T.sm2) * T.slow, LEN_C), op: 1 };
    const k = clamp01((t - T.hit2) / 0.8);
    return { ...blockAt(IC, smashH(F_INT), [1.3, -1.2], k), op: 1 - tw(t, T.hit2 + 0.7, T.hit2 + 1.0, lin) };
  }
  if (t < T.sm3) return atH(tw(t, T.backB[1], T.backB[1] + 0.3));
  if (t < T.rule) {
    if (t < T.land3) return { ...smashAt(H, LS, t - T.sm3, LEN_S), op: 1 };
    const k = clamp01((t - T.land3) / 0.3);
    return { p: lerp2(LS, [LS[0] - 0.1, LS[1] + 0.25], k), h: 0.25 * Math.sin(Math.PI * k), fly: false, op: 1 };
  }
  return null;
}
function shuttle2(t) {
  if (t < T.race || t >= 11.0) return null;
  let real;
  if (t < T.raceLandS) real = (t - T.race) * T.slow;
  else if (t < T.raceResume) real = T_S;
  else real = T_S + (t - T.raceResume) * T.slow;
  return { ...smashAt(H, LC, real, LEN_C), op: 1 - tw(t, 10.0, 10.3, lin) };
}

// ---- 我（位置、朝向、拍子）。一开始站中间（B）----
function meState(t) {
  if (t >= T.loop) t = 0;
  let p = B, face = -90, rk = -90;
  if (t >= T.moveA[0]) p = lerp2(B, A, tw(t, T.moveA[0], T.moveA[1], easeInOut));
  if (t >= T.turnA[0]) face = lerp(-90, FACE_H, tw(t, T.turnA[0], T.turnA[1]));
  if (t >= T.racket - 0.2) rk = lerp(-90, -140, tw(t, T.racket - 0.2, T.racket + 0.1));
  if (t >= T.hit1 - 0.38) {                                   // 直线：往左扑，拍子伸到左边
    const k = tw(t, T.hit1 - 0.38, T.hit1), back = tw(t, T.hit1 + 0.6, T.hit1 + 1.4, easeInOut);
    p = lerp2(lerp2(A, LUNGE, k), A, back); rk = lerp(lerp(-140, -180, k), -140, back);
  }
  if (t >= T.sm2 + 0.3) {                                     // 斜线：往右跨一步
    const k = tw(t, T.sm2 + 0.3, T.hit2 - 0.05, easeInOut);
    p = lerp2(A, STEP, k); rk = lerp(-140, -2, tw(t, T.sm2 + 0.4, T.hit2 - 0.05));
  }
  if (t >= T.backB[0]) {                                      // 回到中间、正对网
    const k = tw(t, T.backB[0], T.backB[1], easeInOut);
    p = lerp2(STEP, B, k); face = lerp(FACE_H, -90, k); rk = lerp(-2, -90, k);
  }
  if (t >= T.sm3 + 0.4) {                                     // 站中间：球都快到了才开始转
    const k = tw(t, T.sm3 + 0.4, T.sm3 + 0.85);
    p = lerp2(B, [-0.3, 3.6], k); face = lerp(-90, -150, k); rk = lerp(-90, -160, k);
  }
  if (t >= T.rule) { p = A; face = FACE_H; rk = -140; }
  return { p, face, rk };
}

// ---- 文字 ----
// 场景里的小标签（文字在脚本 JSON 的 labels 里）和颜色
const LABEL_STYLE = { straight: 'lime', cross: 'pale', first: 'lime', barS: 'lime', barC: 'pale', half: 'lime',
                      face: 'lime', racket: 'lime', step: 'lime', gap: 'warm', late: 'warm' };
const onLine = (to, y) => lerp2(H, to, (y - H[1]) / (to[1] - H[1]));
const SIZES = { zh: { title: 40, big: 84, sub: 56, card: 124 }, ja: { title: 38, big: 76, sub: 54, card: 110 },
                ko: { title: 36, big: 72, sub: 50, card: 104 }, en: { title: 32, big: 66, sub: 50, card: 98 } };
const CARD_Y = { c1: 620, c2: 700, c3: 620, c4: 620 };      // 卡片中心的屏幕 y：放在球场中间，叠在画面上
window.setup = function (spec, lang) {
  setupText(spec, lang, { sizes: SIZES, cardY: CARD_Y, bigY: 540, labelStyle: LABEL_STYLE });   // 开头大字压在对方半场上
  buildCourt('singles'); court.tag.textContent = TX.tag; buildOpts(); buildMarks(); buildShuttle('sh1'); buildShuttle('sh2');
  const tk = $('ticks');
  for (let i = 0; i < 4; i++) el('line', {}, tk);
  return { fonts: [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family) };
};

// ---- 每一帧 ----
window.render = function (t) {
  const inLoop = t >= T.loop;
  const ts = inLoop ? 0 : t;
  CAM = camAt(t, MOVES);
  const z = ZF();
  const worldOp = inLoop ? tw(t, T.loop, T.dur - 0.05) : 1 - tw(t, T.end, T.end + 0.3);
  $('world').setAttribute('opacity', worldOp);
  drawCourt();

  // 对手
  const hj = ts < T.lobEnd ? 1 + 0.15 * tw(ts, 0.55, 1.0) : (ts < 3.0 ? 1.15 : 1);
  let hit = 0;
  for (const s of [T.race, T.sm1, T.sm2, T.sm3]) if (ts >= s && ts < s + 0.3) hit = 1 - (ts - s) / 0.3;
  const hr = 14 * z * (hj + 0.25 * hit);
  $('H').setAttribute('transform', `translate(${X(H[0])},${Y(H[1])}) rotate(${angW(H, [0, 4])})`);
  $('Hc').setAttribute('r', hr); $('Hc').setAttribute('stroke-width', 4.5 * Math.sqrt(z));
  $('Hw').setAttribute('points', `${hr + 13 * z},0 ${hr + 4 * z},${-8 * z} ${hr + 4 * z},${8 * z}`);

  // 我
  const me = meState(ts);
  const mr = 13 * z;
  $('me').setAttribute('transform', `translate(${X(me.p[0])},${Y(me.p[1])})`);
  $('meC').setAttribute('r', mr);
  const fa = me.face * Math.PI / 180;
  const wpt = (r, a) => `${Math.cos(fa + a) * r},${Math.sin(fa + a) * r}`;
  $('meW').setAttribute('points', `${wpt(mr + 13 * z, 0)} ${wpt(mr + 4 * z, -0.42)} ${wpt(mr + 4 * z, 0.42)}`);
  const ra = me.rk * Math.PI / 180, rkPx = RK * CAM.s, headR = 0.13 * CAM.s;
  const armEnd = Math.max(mr + 2, rkPx - headR);
  $('meArm').setAttribute('x1', Math.cos(ra) * mr); $('meArm').setAttribute('y1', Math.sin(ra) * mr);
  $('meArm').setAttribute('x2', Math.cos(ra) * armEnd); $('meArm').setAttribute('y2', Math.sin(ra) * armEnd);
  $('meArm').setAttribute('stroke-width', 3 * Math.sqrt(z));
  const hd = $('meHead');
  hd.setAttribute('cx', Math.cos(ra) * rkPx); hd.setAttribute('cy', Math.sin(ra) * rkPx);
  hd.setAttribute('rx', headR); hd.setAttribute('ry', headR * 0.72);
  hd.setAttribute('transform', `rotate(${me.rk},${Math.cos(ra) * rkPx},${Math.sin(ra) * rkPx})`);
  hd.setAttribute('stroke-width', 3 * Math.sqrt(z));
  const rkOp = ts < T.racket - 0.2 ? 0.4 : 1;
  $('meArm').setAttribute('opacity', rkOp); hd.setAttribute('opacity', rkOp);

  // 线
  let sOp = 0, cOp = 0;
  if (ts >= T.drawS[0] && ts < T.missCard) {
    sOp = ts < T.reveal ? 1 : ts < T.sm1 ? 0.35 : ts < T.sm2 - 0.6 ? 0.7 : 0.25;
    cOp = ts < 11 ? 0.85 : ts < T.reveal ? 0.7 : ts < T.sm2 - 0.6 ? 0.2 : 0.7;
    sOp *= 1 - tw(ts, T.missCard - 0.4, T.missCard, lin);
    cOp *= 1 - tw(ts, T.missCard - 0.4, T.missCard, lin);
  }
  const dimK = Math.min(tw(ts, 12.9, 13.4), 1 - tw(ts, 14.6, 15.0));   // 并排比长短时，两条线让一让
  sOp *= 1 - 0.65 * dimK; cOp *= 1 - 0.65 * dimK;
  if (ts >= T.rule) { sOp = 1; cOp = 0; }
  const lw = 4.5 * Math.sqrt(z);
  setLine($('pStraight'), H, LS, ts >= T.rule ? 1 : tw(ts, T.drawS[0], T.drawS[1], easeInOut), sOp, lw);
  setLine($('pCross'), H, LC, tw(ts, T.drawC[0], T.drawC[1], easeInOut), cOp, lw * 0.85);
  const s2 = shuttle2(ts);
  if (s2 && ts >= T.raceLandS && ts < T.raceResume + 0.3) {
    const rOp = Math.min(tw(ts, T.raceLandS, T.raceLandS + 0.15), 1 - tw(ts, T.raceResume, T.raceResume + 0.3));
    $('pRemain').setAttribute('d', `M${X(s2.p[0])},${Y(s2.p[1])} L${X(LC[0])},${Y(LC[1])}`);
    $('pRemain').setAttribute('opacity', rOp); $('pRemain').setAttribute('stroke-width', lw);
    $('pRemain').setAttribute('stroke-dasharray', `${2 * z} ${12 * z}`);
  } else $('pRemain').setAttribute('opacity', 0);

  // 反转：从中间够到两条线（在我站的深度），然后把两段并排比长短
  const rv = vis(ts, T.reach, 14.7, 0.3, 0.4);
  const pS = tw(ts, T.reach, T.reach + 0.5, easeInOut), pC = tw(ts, T.reach + 0.6, T.reach + 1.1, easeInOut);
  const cmp = tw(ts, T.compare[0], T.compare[1], easeInOut);
  const lenS = dist(B, IS) * CAM.s, lenC = dist(B, IC) * CAM.s;
  const bx = SCX - lenS / 2 + 40, by1 = Y(1.05), by2 = by1 + 52 * z;   // 并排放在我方前场的空地上（字幕上面）
  // 原位：从 B 往左到 IS、往右到 IC；并排：都从 bx 往右
  const sA = [X(B[0]), Y(B[1]) + 0, X(IS[0]), Y(IS[1])], sB = [bx, by1, bx + lenS, by1];
  const cA = [X(B[0]), Y(B[1]) + 0, X(IC[0]), Y(IC[1])], cB = [bx, by2, bx + lenC, by2];
  const mix4 = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
  const sNow = mix4(sA, sB, cmp), cNow = mix4(cA, cB, cmp);
  const sEnd = [lerp(sNow[0], sNow[2], pS), lerp(sNow[1], sNow[3], pS)];
  const cEnd = [lerp(cNow[0], cNow[2], pC), lerp(cNow[1], cNow[3], pC)];
  const rw = 8 * Math.sqrt(z);
  setSeg($('reachS'), sNow[0], sNow[1], sEnd[0], sEnd[1], pS > 0 ? rv : 0, rw);
  setSeg($('reachC'), cNow[0], cNow[1], cEnd[0], cEnd[1], pC > 0 ? rv * 0.9 : 0, rw);
  $('reachS').setAttribute('stroke-dasharray', cmp > 0.01 ? 'none' : `${10 * z} ${8 * z}`);
  $('reachC').setAttribute('stroke-dasharray', cmp > 0.01 ? 'none' : `${10 * z} ${8 * z}`);
  // 多出来的那一段（直线要多够的距离）
  const xk = tw(ts, T.compare[1], T.compare[1] + 0.4);
  setSeg($('reachX'), bx + lenC, by1, bx + lenC + (lenS - lenC) * xk, by1, xk > 0 ? rv : 0, rw * 1.6);
  // 两条线上的“到我这个深度”的点
  for (const [id, p, k] of [['dotS', IS, pS], ['dotC', IC, pC]]) {
    const d = $(id); d.setAttribute('cx', X(p[0])); d.setAttribute('cy', Y(p[1])); d.setAttribute('r', 7 * z);
    d.setAttribute('opacity', k > 0.95 ? rv : 0);
  }
  // 并排时两端的竖线
  const tks = $('ticks').children;
  const tick = (e, x, y, col, op) => { setSeg(e, x, y - 12 * z, x, y + 12 * z, op, 3 * Math.sqrt(z)); e.setAttribute('stroke', col); };
  const tOp = rv * tw(ts, T.compare[1] - 0.1, T.compare[1] + 0.2);
  tick(tks[0], bx, by1, LIME, tOp); tick(tks[1], bx + lenS, by1, LIME, tOp);
  tick(tks[2], bx, by2, PALE, tOp); tick(tks[3], bx + lenC, by2, PALE, tOp);

  // 身体对着他
  const sv = ts >= T.rule ? 0.55 : vis(ts, 19.0, 23.0, 0.4, 0.4) * 0.6;
  const sl = $('sight');
  setSeg(sl, X(me.p[0]), Y(me.p[1]), lerp(X(me.p[0]), X(H[0]), ts >= T.rule ? 1 : tw(ts, 19.0, 19.5)),
         lerp(Y(me.p[1]), Y(H[1]), ts >= T.rule ? 1 : tw(ts, 19.0, 19.5)), ts >= 19.0 ? sv : 0, 2.5 * Math.sqrt(z));
  sl.setAttribute('stroke-dasharray', `${4 * z} ${10 * z}`);
  // 往右跨一步的虚线箭头
  const stp = tw(ts, T.sm2 + 0.15, T.sm2 + 0.45);
  const stv = vis(ts, T.sm2 + 0.15, T.missCard - 0.6, 0.05, 0.3);
  const ay = Y(3.6) + 0.3 * CAM.s, ax0 = X(A[0]) + 0.15 * CAM.s, ax1 = X(STEP[0]) - 0.12 * CAM.s;
  const axn = lerp(ax0, ax1, stp);
  $('stepArrow').setAttribute('d', `M${ax0},${ay} L${axn},${ay}`);
  $('stepArrow').setAttribute('opacity', stv); $('stepArrow').setAttribute('stroke-width', 4 * Math.sqrt(z));
  $('stepArrow').setAttribute('stroke-dasharray', `${10 * z} ${9 * z}`);
  $('stepHead').setAttribute('transform', `translate(${axn + 8 * z},${ay}) scale(${z})`);
  $('stepHead').setAttribute('opacity', stp > 0.05 ? stv : 0);
  // 半步的尺寸线（A 和 B 之间，按真实的 0.45 米）
  const hdv = vis(ts, T.moveA[0] + 0.1, 18.2, 0.3, 0.3);
  const hy = Y(3.6) + 72 * z, hx0 = X(A[0]), hx1 = X(B[0]), hw = 3 * Math.sqrt(z);
  setSeg($('hd0'), hx0, hy, hx1, hy, hdv, hw);
  setSeg($('hd1'), hx0, hy - 9 * z, hx0, hy + 9 * z, hdv, hw);
  setSeg($('hd2'), hx1, hy - 9 * z, hx1, hy + 9 * z, hdv, hw);

  // 场景里的小标签：每次最多两个，贴在它说的东西旁边
  if (!inLoop) {
    const pS8 = onLine(LS, -1.2), pC8 = onLine(LC, -1.2);   // 放在对方半场，不压字幕
    placeLabel('straight', ts, 6.3, 8.7, X(pS8[0]) - 22, Y(pS8[1]), 'r');
    placeLabel('cross', ts, 6.6, 8.7, X(pC8[0]) + 24, Y(pC8[1]), 'l');
    placeLabel('first', ts, T.raceLandS, 10.1, X(LS[0]) - 22 * z, Y(LS[1]) - 40 * z, 'r');
    placeLabel('barS', ts, T.compare[1], 14.7, bx - 18, by1, 'r');
    placeLabel('barC', ts, T.compare[1] + 0.1, 14.7, bx - 18, by2, 'r');
    placeLabel('half', ts, T.moveA[0] + 0.2, 18.2, hx0 - 22 * z, hy, 'r');
    const dir = [H[0] - me.p[0], H[1] - me.p[1]], dl = Math.hypot(dir[0], dir[1]);
    const fp = [me.p[0] + dir[0] / dl * 1.3, me.p[1] + dir[1] / dl * 1.3];
    placeLabel('face', ts, 19.5, 22.2, X(fp[0]) + 26, Y(fp[1]), 'l');
    const hx = X(me.p[0]) + Math.cos(ra) * rkPx, hyy = Y(me.p[1]) + Math.sin(ra) * rkPx;
    placeLabel('racket', ts, 19.6, 21.3, hx, hyy - headR - 34, 'c');
    placeLabel('step', ts, T.sm2 + 0.4, 26.2, (ax0 + ax1) / 2, ay + 34 * z, 'c');
    placeLabel('gap', ts, 28.1, 29.5, X(-1.15), Y(3.6), 'c');
    placeLabel('late', ts, T.land3 + 0.05, 31.0, X(LS[0]) - 22 * z, Y(LS[1]) - 40 * z, 'r');
  } else hideLabels();

  // 选项圈（从左到右 A B C；A 对）
  for (const [i, k] of ['A', 'B', 'C'].entries()) {
    const o = opts[k];
    const t0 = T.opt[i];
    const sc = ts < t0 ? 0 : easeOutBack(clamp01((ts - t0) / 0.3));
    let op = ts < t0 ? 0 : Math.min(1, (ts - t0) / 0.15);
    if (ts >= 7.0 && ts < T.reveal) op *= lerp(1, 0.35, tw(ts, 7.0, 7.4));
    op *= 1 - tw(ts, 18.2, 18.6);
    const right = k === 'A', rv2 = ts >= T.reveal;
    const col = rv2 ? (right ? LIME : WARM) : PALE;
    o.ring.setAttribute('stroke', col);
    o.ring.setAttribute('stroke-dasharray', rv2 && right ? 'none' : '6 5');
    o.ring.setAttribute('stroke-width', rv2 && right ? 4 : 3);
    o.ring.setAttribute('filter', rv2 && right ? 'url(#g1)' : 'none');
    o.txt.setAttribute('fill', col);
    if (rv2 && !right) op *= 0.6;
    const pop = rv2 && right ? 1 + 0.25 * (1 - tw(ts, T.reveal, T.reveal + 0.4)) : 1;
    o.g.setAttribute('transform', `translate(${X(o.p[0])},${Y(o.p[1])}) scale(${Math.max(0.001, sc * pop * z)})`);
    o.g.setAttribute('opacity', op);
  }
  // 勾和叉
  showMark(M.okA, X(A[0]), Y(A[1]), ts, T.reveal, T.moveA[0]);
  showMark(M.noB, X(B[0]) + 16 * z, Y(B[1]) + 16 * z, ts, T.reveal + 0.07, T.moveA[0]);
  showMark(M.noC, X(C[0]), Y(C[1]), ts, T.reveal + 0.13, 18.6);
  showMark(M.ok1, X(IS[0]) - 0.28 * CAM.s, Y(IS[1]) - 0.28 * CAM.s, ts, T.hit1, T.sm2 - 0.6);
  showMark(M.ok2, X(IC[0]) + 0.28 * CAM.s, Y(IC[1]) - 0.28 * CAM.s, ts, T.hit2, T.missCard - 0.8);
  showMark(M.miss, X(-0.3) + 24 * z, Y(3.6) - 24 * z, ts, T.land3 + 0.1, T.rule);
  pulse($('pulse1'), LS, ts, T.raceLandS);
  pulse($('pulse2'), LS, ts, T.land3);

  drawShuttle('sh1', shuttle1, ts);
  drawShuttle('sh2', shuttle2, ts);

  // 字（字幕跟着镜头：全场时在网和我之间，推近时在我身后）
  renderText(t, lerp(CAP_TOP.full, CAP_TOP.near, clamp01((CAM.s - FULL.s) / (HALF.s - FULL.s))));
};
</script>
</body></html>
