<script>
'use strict';
// ---- 镜头 ----
// 这一集球要从我方反手后场一直飞到对方底线，两边的底线都要看得到，所以全片只用一个全场镜头（不推拉）。
// 安全区（2026-11-21）：顶栏在 y 300–398，字、人、球都在 y 1500 以上
const OPEN = { cx: 0, cy: -1.315, s: 82 };    // 对方底线 y≈415（线可以伸出去），A 圈 y≈469，他前压的地方 y≈685，网 y≈965，我在反手后场 y≈1436
const FULL = OPEN;                             // common.js 按它算粗细，循环帧也回到它
const MOVES = [];
// 字幕顶边：每一句放在那几秒没有动作的地方（我在角落时放我方中场；我在走动时放对方前场；他冲网前时放对方后场）
const CAP = { hook: 850, analogy: 1170, mechanism: 1170, reversal: 1170, answer: 1170, ready: 725, middle: 725, miss: 455, cta: 1170 };

// ---- 位置（米；原点 = 网的中点，x 向右、y 向我方）----
// 我右手持拍、面朝网：我的反手后场 = 我方左后场（屏幕左下）
const O0 = [0.6, -4.8];                     // 他打进攻高远（平高）的地方
const OB = [0.25, -3.4];                    // 他打完往前压一步，等我回一个弱球
const MB = [0, 3.2];                        // 我的中心位置
const MC = [-1.8, 5.75];                    // 我被压到反手后场的位置
const SH = [-2.0, 6.15];                    // 球在我身后（地面投影）
// A 又远又快的过渡球（直线压到他底线）、B 吊网前、C 又高又飘、打不到底线的高球
const A = [-1.7, -6.0], B = [-2.05, -2.25], C = [0.2, -4.4];
const RK = 0.62;                            // 拍面中心离身体中心（米）
// A：快、平一点、够深。真实时间约 0.95 秒到他底线（只用来排先后，不上屏）
const T_A = 0.95;
function fastAt(realT) {
  const k = clamp01(realT / T_A), g = 1 - (1 - k) ** 1.3;
  return { p: lerp2(SH, A, g), h: lerp(1.8, 1.0, g) + 2.4 * Math.sin(Math.PI * g), fly: k < 1, k };
}
// C：从身后够的高球，飞得高、飞得久，只到他半场。真实时间约 2.2 秒
const T_C = 2.2;
function highAt(realT) {
  const k = clamp01(realT / T_C), g = 1 - (1 - k) ** 1.6;
  return { p: lerp2(SH, C, g), h: lerp(1.8, 2.7, g) + 7.5 * Math.sin(Math.PI * g), fly: k < 1, k };
}
const CS = [0.35, -4.05];                   // 他在半场截高球站的地方（几乎不用动）
const AS = [-1.45, -5.6];                   // 他被压到底线接快球站的地方
// 他在底线被动起球：高高挑回我的后场中路，约 2 秒
const LT = [0.3, 5.3], LP = [0.2, 4.85];    // 球落点 / 我接球站的地方
const T_L = 2.0;
function liftAt(realT) {
  const k = clamp01(realT / T_L), g = 1 - (1 - k) ** 1.5;
  return { p: lerp2(A, LT, g), h: lerp(1.0, 2.4, g) + 8.5 * Math.sin(Math.PI * g), fly: k < 1, k };
}
// 吊网前（从身后够的反手吊球，又慢又飘）：只有阻力的减速模型，v0 = 14 米/秒
const LD = 4.6, VD = 14;
const sD = (t) => LD * Math.log(1 + VD * Math.max(0, t) / LD);
const tD = (s) => (Math.exp(s / LD) - 1) * LD / VD;
const LEN_B = dist(SH, B);
const FK = (SH[1] - 0.07) / (SH[1] - B[1]);  // 球刚过网（y = −0.07）时被他扑到
const weakH = (f) => lerp(2.0, 0, f) + 2.4 * Math.sin(Math.PI * f);
const T_K = tD(FK * LEN_B);                  // 吊球飞到扑球点的真实时间
const PK = lerp2(SH, B, FK), HK0 = weakH(FK);
const STAND3 = [-1.6, -0.75];                // 他扑球时站的地方
const KL = [1.0, 2.6];                       // 扑下来的落点：我方中场空着的那一边
const KILL = 0.35;                           // 扑球飞行时间
const R1 = [-1.0, 4.6], R2 = [-0.3, 3.9];    // 我吊完往回走，再扑过去，还差一段

// ---- 时间点（秒）：和 #01、#02、#06 同一条两小节网格 ----
const T = {
  title: 0.3, opt: [1.2, 1.333, 1.467], atkEnd: 2.2, oBack: [0.3, 2.0], meGo: [0.4, 2.1],
  drawA: [5.7, 6.3], drawC: [5.85, 6.45],
  race: 7.6, runs: 11.3,
  reveal: 15.0, aLit: [16.8, 17.4],
  hit2: 19.6, oDeep: [19.65, 20.5], meBack2: [19.8, 20.9], lift: 20.6, meUnder: [21.4, 22.4],
  missCard: 27.0, reset3: [27.2, 27.8], sm3: 29.2, rule: 31.0,
  end: 36.3, loop: 37.6, dur: 38.0,
};
T.landA = T.race + T_A;
T.landC = T.race + T_C;
T.arrA2 = T.hit2 + T_A;
T.landL = T.lift + T_L;
T.contact = T.sm3 + T_K;
T.land3 = T.contact + KILL;
window.TIMES = T;

// ---- 选项：三个落点 ----
const OPTS = [['A', A], ['B', B], ['C', C]];
const opts = {};
function buildOpts() {
  for (const [k, p] of OPTS) {
    const g = el('g', {}, $('opts'));
    const ring = el('circle', { cx: 0, cy: 0, r: 17, fill: 'none', 'stroke-width': 3, 'stroke-dasharray': '6 5' }, g);
    const txt = el('text', { x: 0, y: 47, 'text-anchor': 'middle', 'font-family': 'BLAB', 'font-weight': 700, 'font-size': 26 }, g);
    txt.textContent = k;
    opts[k] = { g, ring, txt, p };
  }
}
let M = {};
function buildMarks() {
  M = { okA: mark('ok', LIME, 12), noB: mark('no', WARM, 10), noC: mark('no', WARM, 10),
        okBack2: mark('ok', LIME, 13), okUnder: mark('ok', LIME, 15), miss: mark('no', WARM, 17) };
}

// ---- 我（实心荧光绿点 + 朝向小三角 + 拍子）----
const ME = {};
function buildMe() {
  const g = el('g', {}, $('players'));
  Object.assign(ME, { g, arm: el('line', { stroke: LIME, 'stroke-linecap': 'round' }, g), head: el('ellipse', { fill: 'none', stroke: LIME }, g),
    c: el('circle', { fill: LIME, filter: 'url(#g2)' }, g), w: el('polygon', { fill: LIME }, g) });
}
function drawMe(st, rkOp) {
  const o = ME, z = ZF(), mr = 13 * z;
  o.g.setAttribute('transform', `translate(${X(st.p[0])},${Y(st.p[1])})`);
  o.c.setAttribute('r', mr);
  const fa = st.face * Math.PI / 180;
  const wpt = (r, a) => `${Math.cos(fa + a) * r},${Math.sin(fa + a) * r}`;
  o.w.setAttribute('points', `${wpt(mr + 13 * z, 0)} ${wpt(mr + 4 * z, -0.42)} ${wpt(mr + 4 * z, 0.42)}`);
  const ra = st.rk * Math.PI / 180, rkPx = RK * CAM.s, headR = 0.13 * CAM.s;
  const armEnd = Math.max(mr + 2, rkPx - headR);
  o.arm.setAttribute('x1', Math.cos(ra) * mr); o.arm.setAttribute('y1', Math.sin(ra) * mr);
  o.arm.setAttribute('x2', Math.cos(ra) * armEnd); o.arm.setAttribute('y2', Math.sin(ra) * armEnd);
  o.arm.setAttribute('stroke-width', 3 * Math.sqrt(z));
  o.head.setAttribute('cx', Math.cos(ra) * rkPx); o.head.setAttribute('cy', Math.sin(ra) * rkPx);
  o.head.setAttribute('rx', headR); o.head.setAttribute('ry', headR * 0.72);
  o.head.setAttribute('transform', `rotate(${st.rk},${Math.cos(ra) * rkPx},${Math.sin(ra) * rkPx})`);
  o.head.setAttribute('stroke-width', 3 * Math.sqrt(z));
  o.arm.setAttribute('opacity', rkOp); o.head.setAttribute('opacity', rkOp);
}
// 我在 t 秒的位置、朝向、拍子角度（屏幕角度，-90 = 朝网）
const FACE_C = angW(MB, MC) - 20;            // 被压在反手后场：身体背着网、侧向底角
const RK_BH = angW(MC, SH) - 25;             // 反手够身后的球：拍子伸向左后
const BH_SW = -150;                          // 反手出手：拍子往左前甩
const RK_UP = -40;                           // 在后场中路接他的挑球：拍子举在正手一侧
function swing(t, at) { return t >= at - 0.12 && t < at + 0.5 ? Math.sin(Math.PI * clamp01((t - at + 0.12) / 0.62)) : 0; }
function meAt(t) {
  if (t >= T.loop) t = 0;
  const s = { p: MB, face: -90, rk: -90 };
  if (t >= T.meGo[0]) {                                     // 平高压到反手后场
    const k = tw(t, T.meGo[0], T.meGo[1], easeInOut);
    s.p = lerp2(MB, MC, k); s.face = lerp(-90, FACE_C, k); s.rk = lerp(-90, RK_BH, k);
  }
  if (t >= T.meBack2[0]) {                                  // 演示：快球出手后回中间
    const k = tw(t, T.meBack2[0], T.meBack2[1], easeInOut);
    s.p = lerp2(MC, MB, k); s.face = lerp(FACE_C, -90, k); s.rk = lerp(RK_BH, -90, k);
  }
  if (t >= T.meUnder[0]) {                                  // 他被动挑过来，我从中间退半步，到位
    const k = tw(t, T.meUnder[0], T.meUnder[1], easeInOut);
    s.p = lerp2(MB, LP, k); s.face = -90; s.rk = lerp(-90, RK_UP, k);
  }
  if (t >= T.reset3[0]) {
    const k = tw(t, T.reset3[0], T.reset3[1], easeInOut);
    s.p = lerp2(LP, MC, k); s.face = lerp(-90, FACE_C, k); s.rk = lerp(RK_UP, RK_BH, k);
  }
  if (t >= T.sm3 + 0.15) {                                  // 吊完往回走，再扑过去，还是晚了
    const k1 = tw(t, T.sm3 + 0.15, T.contact, easeInOut), k2 = tw(t, T.contact, T.land3 + 0.05, easeOutCubic);
    const fTo = angW(R1, KL);
    s.p = k2 > 0 ? lerp2(R1, R2, k2) : lerp2(MC, R1, k1);
    s.face = k2 > 0 ? fTo : lerp(FACE_C, -90, k1);
    s.rk = k2 > 0 ? lerp(-90, fTo - 10, k2) : lerp(RK_BH, -90, k1);
  }
  if (t >= T.rule - 0.3) {                                  // 规则卡：回到反手后场
    const k = tw(t, T.rule - 0.3, T.rule + 0.3, easeInOut), fTo = angW(R1, KL);
    s.p = lerp2(R2, MC, k); s.face = lerp(fTo, FACE_C, k); s.rk = lerp(fTo - 10, RK_BH, k);
  }
  for (const at of [T.race, T.hit2, T.sm3]) { const w = swing(t, at); if (w > 0) s.rk = lerp(s.rk, BH_SW, w); }
  return s;
}

// ---- 对手（橙色空心点，朝着我）----
function oppAt(t) {
  if (t >= T.loop) t = 0;
  let p = O0;
  if (t >= T.oBack[0]) p = lerp2(O0, OB, tw(t, T.oBack[0], T.oBack[1], easeInOut));
  if (t >= T.oDeep[0]) p = lerp2(OB, AS, tw(t, T.oDeep[0], T.oDeep[1], easeInOut));        // 演示：快球压到底线，他一路退
  if (t >= 26.5) p = lerp2(AS, OB, tw(t, 26.5, 27.0, easeInOut));                         // 比我早一点回位，免得穿过“常见错误”的字幕
  if (t >= T.sm3 + 0.05) p = lerp2(OB, STAND3, tw(t, T.sm3 + 0.05, T.contact - 0.05, easeInOut));   // 吊网前：他冲到网前
  if (t >= T.land3 + 0.1) p = lerp2(STAND3, OB, tw(t, T.land3 + 0.1, T.rule, easeInOut));          // 规则卡出来前就回到原位
  return p;
}

// ---- 球 ----
const hang = (op) => ({ p: SH, h: 1.6, fly: false, op });
function shuttle1(t) {                                     // 主球
  if (t >= T.loop) t = 0;
  if (t < T.atkEnd) {                                      // 他的进攻高远（平高）：飞过他够不着的高度，落到我身后
    const k = t / T.atkEnd, kk = 1 - (1 - k) ** 1.4;
    return { p: lerp2([O0[0] - 0.05, O0[1] + 0.25], SH, kk), h: lerp(2.6, 1.6, kk) + 2.6 * Math.sin(Math.PI * kk), fly: true, op: 1 };
  }
  if (t < T.race) return hang(1);
  if (t < 11.0) return { ...fastAt(t - T.race), op: 1 - tw(t, 10.6, 10.9, lin) };   // 比一比：快球（真实速度）
  if (t < T.hit2) return hang(tw(t, 11.0, 11.3));
  if (t < T.lift) return { ...fastAt(t - T.hit2), op: 1 };                          // 演示：快球压到底线
  if (t < T.reset3[0]) {                                                            // 他在底线被动挑回来，我到位
    const l = liftAt(t - T.lift);
    return { ...l, op: 1 - tw(t, 26.3, 26.7, lin) };
  }
  if (t < T.reset3[1]) return null;
  if (t < T.sm3) return hang(tw(t, T.reset3[1], T.reset3[1] + 0.3));
  if (t < T.rule) {                                        // 常见错误：吊网前，又慢又飘，他在网前扑下来
    if (t < T.contact) { const f = Math.min(1, sD(t - T.sm3) / LEN_B); return { p: lerp2(SH, B, f), h: weakH(f), fly: true, op: 1 }; }
    const k = clamp01((t - T.contact) / KILL);
    if (k < 1) return { p: lerp2(PK, KL, k), h: HK0 * (1 - k), fly: true, op: 1 };
    return { p: KL, h: 0, fly: false, op: 1 - tw(t, 30.7, 31.0, lin) };
  }
  if (t < T.end) return hang(tw(t, T.rule + 0.4, T.rule + 0.7));
  return null;
}
function shuttle2(t) {                                     // 只在“比一比”那一段：高球那颗
  if (t < T.race || t >= 11.0) return null;
  return { ...highAt(t - T.race), op: 1 - tw(t, 10.6, 10.9, lin) };
}

// ---- 文字 ----
const LABEL_STYLE = { fast: 'lime', high: 'pale', first: 'lime', short: 'warm', deep: 'lime', cut: 'warm', back: 'lime', lift: 'lime', reach: 'lime', early: 'warm', late: 'warm' };
const SIZES = { zh: { title: 40, big: 84, sub: 56, card: 124 }, ja: { title: 38, big: 76, sub: 54, card: 110 },
                ko: { title: 36, big: 72, sub: 50, card: 104 }, en: { title: 32, big: 66, sub: 50, card: 98 } };
const CARD_Y = { c1: 1060, c2: 1060, c3: 1060, c4: 860 };   // 卡片中心的屏幕 y：c1–c3 在我方前场（那几段没有动作），规则卡在对方前场
let SUB_KEYS = [];
window.setup = function (spec, lang) {
  SUB_KEYS = spec.subs.map((s) => s[2]);
  setupText(spec, lang, { sizes: SIZES, cardY: CARD_Y, bigY: 1068, labelStyle: LABEL_STYLE });
  buildCourt('singles'); court.tag.textContent = TX.tag; buildOpts(); buildMarks(); buildMe(); buildShuttle('sh1'); buildShuttle('sh2');
  return { fonts: [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family) };
};

// ---- 每一帧 ----
function dashLine(path, from, to, p, op, w, z) {              // 虚线（人跑的路线）：从 from 画到 to，p = 画出来的比例
  const q = lerp2(from, to, clamp01(p));
  path.setAttribute('d', `M${X(from[0])},${Y(from[1])} L${X(q[0])},${Y(q[1])}`);
  path.setAttribute('opacity', p > 0 ? op : 0); path.setAttribute('stroke-width', w);
  path.style.strokeDasharray = `${10 * z} ${9 * z}`;
}
function arrow(from, to, p, op, z) {                          // 回中间的虚线箭头
  const end = lerp2(from, to, clamp01(p));
  $('backArrow').setAttribute('d', `M${X(from[0])},${Y(from[1])} L${X(end[0])},${Y(end[1])}`);
  $('backArrow').setAttribute('opacity', op); $('backArrow').setAttribute('stroke-width', 4 * Math.sqrt(z));
  $('backArrow').setAttribute('stroke-dasharray', `${10 * z} ${9 * z}`);
  $('backHead').setAttribute('transform', `translate(${X(end[0])},${Y(end[1])}) rotate(${angW(from, to)}) scale(${z})`);
  $('backHead').setAttribute('opacity', p > 0.05 ? op : 0);
}
const BACK_TO = [MB[0] + 0.3, MB[1] + 0.45];                   // 箭头停在中心点前面一点，不压住人
window.render = function (t) {
  const inLoop = t >= T.loop;
  const ts = inLoop ? 0 : t;
  CAM = camAt(t, MOVES);
  const z = ZF();
  const worldOp = inLoop ? tw(t, T.loop, T.dur - 0.05) : 1 - tw(t, T.end, T.end + 0.3);
  $('world').setAttribute('opacity', worldOp);
  drawCourt();

  // 对手：出手时稍微放大一下
  const op = oppAt(ts), me = meAt(ts);
  let hit = ts < 0.3 ? 1 - ts / 0.3 : 0;
  for (const at of [T.lift, T.contact]) if (ts >= at && ts < at + 0.3) hit = 1 - (ts - at) / 0.3;
  const or = 14 * z * (1 + 0.25 * hit);
  $('O').setAttribute('transform', `translate(${X(op[0])},${Y(op[1])}) rotate(${angW(op, me.p)})`);
  $('Oc').setAttribute('r', or); $('Oc').setAttribute('stroke-width', 4.5 * Math.sqrt(z));
  $('Ow').setAttribute('points', `${or + 13 * z},0 ${or + 4 * z},${-8 * z} ${or + 4 * z},${8 * z}`);

  drawMe(me, ts < T.meGo[1] - 0.3 ? 0.4 : 1);

  // 两条线（地面投影）：快球（荧光绿）、高球（淡白）
  const lw = 4.5 * Math.sqrt(z);
  let aOp = 0, cOp = 0;
  if (ts >= T.drawA[0] && ts < T.missCard) {
    if (ts < 11.0) { aOp = 1; cOp = 0.85; }
    else if (ts < T.reveal) { aOp = 0.3; cOp = 0.3; }
    else if (ts < T.aLit[0]) { aOp = 0.3; cOp = 0.2; }
    else if (ts < T.hit2 + 0.6) { aOp = lerp(0.3, 1, tw(ts, T.aLit[0], T.aLit[1])); cOp = 0.15 * (1 - tw(ts, 18.2, 18.6)); }
    else { aOp = 0.35 * (1 - tw(ts, T.lift, T.lift + 0.5, lin)); cOp = 0; }
    const f = 1 - tw(ts, T.missCard - 0.4, T.missCard, lin); aOp *= f; cOp *= f;
  }
  if (ts >= T.rule) { aOp = tw(ts, T.rule + 0.3, T.rule + 0.8); cOp = 0; }
  setLine($('pClear'), SH, A, ts >= T.rule ? 1 : tw(ts, T.drawA[0], T.drawA[1], easeInOut), aOp, lw);
  setLine($('pFlat'), SH, C, tw(ts, T.drawC[0], T.drawC[1], easeInOut), cOp, lw * 0.85);
  $('pFlat').setAttribute('stroke', PALE);
  for (const id of ['pAngL', 'pAngR', 'farLine']) $(id).setAttribute('opacity', 0);

  // 他要怎么接：高球原地就截（橙色，短），快球得退到底线（荧光绿，长）
  const rw = 4 * Math.sqrt(z);
  let dP = 0, dOp = 0, nP = 0, nOp = 0;
  if (ts >= T.runs && ts < T.reveal) {
    dP = tw(ts, T.runs + 0.1, T.runs + 0.7, easeInOut); nP = tw(ts, T.runs + 0.3, T.runs + 0.9, easeInOut);
    dOp = nOp = 1 - tw(ts, 14.6, 15.0, lin);
  }
  if (ts >= T.oDeep[0] - 0.1 && ts < T.lift + 0.6) { dP = 1; dOp = 0.75 * tw(ts, T.oDeep[0] - 0.1, T.oDeep[0] + 0.2) * (1 - tw(ts, T.lift, T.lift + 0.6, lin)); }
  dashLine($('pAngL'), OB, AS, dP, dOp, rw, z); $('pAngL').setAttribute('stroke', LIME);
  dashLine($('runCut'), OB, CS, nP, nOp, rw, z);

  // 回中间：虚线箭头（演示、规则卡）
  if (ts >= T.meBack2[0] - 0.1 && ts < T.meUnder[0] + 0.3) arrow(MC, BACK_TO, tw(ts, T.meBack2[0] - 0.1, T.meBack2[0] + 0.5), vis(ts, T.meBack2[0] - 0.1, T.meUnder[0] + 0.3, 0.05, 0.3), z);
  else if (ts >= T.rule) arrow(MC, BACK_TO, tw(ts, T.rule + 0.6, T.rule + 1.2), 0.8 * tw(ts, T.rule + 0.6, T.rule + 0.8), z);
  else arrow(MC, BACK_TO, 0, 0, z);

  // 常见错误：我扑过去还差的一段（橙色虚线）
  const lv = vis(ts, T.land3, T.rule, 0.15, 0.25);
  const mp = me.p;
  setSeg($('lunge'), X(mp[0]), Y(mp[1]), X(KL[0]), Y(KL[1]), lv, 4 * Math.sqrt(z));
  $('lunge').setAttribute('stroke-dasharray', `${2 * z} ${11 * z}`);

  // 场景里的小标签：每次最多两个
  if (!inLoop) {
    const pA = lerp2(SH, A, 0.42), pC = lerp2(SH, C, 0.42);
    placeLabel('fast', ts, 6.3, 8.6, X(pA[0]) - 24 * z, Y(pA[1]), 'r');
    placeLabel('high', ts, 6.6, 8.6, X(pC[0]) + 24 * z, Y(pC[1]), 'l');
    placeLabel('first', ts, T.landA, 10.9, X(A[0]) + 30 * z, Y(A[1]) + 4 * z, 'l');
    placeLabel('short', ts, T.landC, 10.9, X(C[0]) + 30 * z, Y(C[1]) + 4 * z, 'l');
    const mD = lerp2(OB, AS, 0.5);
    placeLabel('deep', ts, T.runs + 0.6, 14.7, X(mD[0]) - 26 * z, Y(mD[1]), 'r');
    placeLabel('cut', ts, T.runs + 0.8, 14.7, X(CS[0]) + 30 * z, Y(CS[1]) + 4 * z, 'l');
    const bm = lerp2(MC, MB, 0.5);
    placeLabel('back', ts, T.meBack2[1], T.meUnder[0] + 0.2, X(bm[0]) + 40 * z, Y(bm[1]) + 10 * z, 'l');
    placeLabel('lift', ts, T.lift, 22.6, X(AS[0]) + 30 * z, Y(AS[1]) + 4 * z, 'l');
    placeLabel('reach', ts, T.landL, 26.6, X(LP[0]) + 40 * z, Y(LP[1]) + 8 * z, 'l');
    placeLabel('early', ts, T.contact - 0.3, T.land3 + 0.3, X(STAND3[0]) + 30 * z, Y(STAND3[1]) - 40 * z, 'l');
    placeLabel('late', ts, T.land3 + 0.05, T.rule, X(KL[0]) + 30 * z, Y(KL[1]) + 6 * z, 'l');
  } else hideLabels();

  // 选项圈（A 对）
  for (const [i, [k]] of OPTS.entries()) {
    const o = opts[k], t0 = T.opt[i];
    const sc = ts < t0 ? 0 : easeOutBack(clamp01((ts - t0) / 0.3));
    let oo = ts < t0 ? 0 : Math.min(1, (ts - t0) / 0.15);
    if (ts >= 5.0 && ts < T.reveal) oo *= lerp(1, 0.4, tw(ts, 5.0, 5.4));
    oo *= 1 - tw(ts, 18.2, 18.6);
    const right = k === 'A', rv2 = ts >= T.reveal;
    const col = rv2 ? (right ? LIME : WARM) : PALE;
    if (rv2 && !right) oo *= 0.6;
    const pop = rv2 && right ? 1 + 0.25 * (1 - tw(ts, T.reveal, T.reveal + 0.4)) : 1;
    o.ring.setAttribute('stroke', col);
    o.ring.setAttribute('stroke-dasharray', rv2 && right ? 'none' : '6 5');
    o.ring.setAttribute('stroke-width', rv2 && right ? 4 : 3);
    o.ring.setAttribute('filter', rv2 && right ? 'url(#g1)' : 'none');
    o.txt.setAttribute('fill', col);
    o.g.setAttribute('transform', `translate(${X(o.p[0])},${Y(o.p[1])}) scale(${Math.max(0.001, sc * pop * z)})`);
    o.g.setAttribute('opacity', oo);
  }
  // 勾和叉
  showMark(M.okA, X(A[0]) + 36 * z, Y(A[1]) + 2 * z, ts, T.reveal, 17.9);
  showMark(M.noB, X(B[0]) + 26 * z, Y(B[1]) - 22 * z, ts, T.reveal + 0.07, 17.9);
  showMark(M.noC, X(C[0]) + 36 * z, Y(C[1]) + 2 * z, ts, T.reveal + 0.13, 17.9);
  showMark(M.okBack2, X(MB[0]) - 40 * z, Y(MB[1]) - 30 * z, ts, T.meBack2[1], T.meUnder[0] + 0.2);
  showMark(M.okUnder, X(LP[0]) - 40 * z, Y(LP[1]) - 24 * z, ts, T.landL, 26.6);
  showMark(M.miss, X(KL[0]) - 34 * z, Y(KL[1]) - 30 * z, ts, T.land3 + 0.1, T.rule - 0.2);
  pulse($('pulse1'), A, ts, ts < 15 ? T.landA : T.arrA2);
  pulse($('pulse2'), ts < 20 ? C : KL, ts, ts < 20 ? T.landC : T.land3);

  drawShuttle('sh1', shuttle1, ts);
  drawShuttle('sh2', shuttle2, ts);

  renderText(t, 1170);
  for (let i = 0; i < SUBS.length; i++) SUBS[i].e.style.top = (CAP[SUB_KEYS[i]] ?? 1170) + 'px';
};
</script>
</body></html>
