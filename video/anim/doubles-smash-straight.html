<script>
'use strict';
// ---- 镜头 ----
// 只用一个镜头（不推拉）：对方两个防守的人、他们后场的选项 C、我在后场的击球点、同伴在网前都看得到。
// 字幕压在网上（网前后各一米没人站，只有球飞过去），章节卡放在对方中场和网之间。
// 安全区：选项 C 的圈 y≈445，A/B 圈 y≈568，对方两人 y≈654/692，网 y≈1005，同伴 y≈1205，我 y≈1480
const FULL = { cx: 0, cy: -1.563, s: 95 };
const MOVES = [];
const CAP_TOP = 925;                           // 字幕顶边：两行字幕底边约 1090，不碰同伴

// ---- 位置（米；原点 = 网的中点，x 向右、y 向我方）----
// 对方把球挑到我们的左后场（从我们这边看的左边）。我退到左后场准备杀，同伴上网，我们变成一前一后。
// 对方两人并排防守，按 #02 的站法一起往直线这边挪：直线那边的人靠边线，斜线那边的人站到中线附近、稍微靠前。
const ME0 = [-1.5, 3.9], PA0 = [1.5, 3.9];     // 挑球之前：我们两人并排
const SM = [-2.1, 5.0];                         // 我在后场杀球的位置
const SH = [-2.05, 4.95];                       // 球在我头顶（地面投影）
const PF = [-0.4, 2.1];                         // 同伴在网前（前发球线后面一点，偏直线这边）
const DS0 = [-1.5, -3.7], DC0 = [1.5, -3.7];    // 对方一开始并排
const DS = [-1.95, -3.7];                       // 直线那边的人（守直线）
const DC = [0.6, -3.3];                         // 斜线那边的人（中线附近，稍靠前）
const A = [-2.35, -4.6], B = [2.4, -4.6], C = [0, -5.9];   // 杀直线、杀斜线、打高远的落点
const RK = 0.62;                                // 拍面中心离身体中心（米）
const LEN_A = dist(SH, A), LEN_B = dist(SH, B);
const T_A = tOf(LEN_A), T_B = tOf(LEN_B);       // 杀球用 common.js 的减速模型：直线约 0.53 秒、斜线约 0.68 秒，不上屏
const fOn = (to, y) => (y - SH[1]) / (to[1] - SH[1]);
const onLine = (to, y) => lerp2(SH, to, fOn(to, y));
const F_IS = fOn(A, DS[1]), F_IC = fOn(B, DC[1]);
const IS = onLine(A, DS[1]), IC = onLine(B, DC[1]);       // 两种杀球经过对方防守深度的点
const T_IS = tOf(F_IS * LEN_A), T_IC = tOf(F_IC * LEN_B);
const KP = [-1.4, 0.7];                         // 他挡直线网前，同伴在这里封
const PK = [-0.95, 1.1];                        // 同伴封网时站的地方
const KL = [-0.9, -1.9];                        // 同伴扑下去的落点（对方两人中间靠前）
const DC2 = [1.3, -3.3];                        // 杀斜线：斜线那边的人往右一步就接到
const RD = [2.35, 3.7];                         // 他抽直线，落在我们右边中场的空当
const ME3 = [0.05, 4.55];                       // 我杀完斜线往右追，还差一段
const BLK = 1.5, DRV = 0.5, KILL = 0.25;        // 挡网前（0.5× 慢放时画面上的秒数）、抽直线（真实秒数）、扑球（真实秒数）

// ---- 时间点（秒）：和 #01、#02、#06 同一条两小节网格 ----
const T = {
  title: 0.3, opt: [1.2, 1.333, 1.467], lobEnd: 2.4, go: [0.5, 2.3],
  drawS: [5.7, 6.3], drawC: [5.85, 6.45],
  race: 7.6, freeze: 0.8, slow: 0.5,
  rev: 11.3, reveal: 15.0, aLit: [16.8, 17.4],
  sm1: 20.6,
  missCard: 27.0, reset: [27.2, 27.8], rule: 31.0,
  end: 36.3, loop: 37.6, dur: 38.0,
};
T.raceLandA = T.race + T_A / T.slow;
T.raceResume = T.raceLandA + T.freeze;
T.raceLandB = T.raceResume + (T_B - T_A) / T.slow;
T.hit1 = T.sm1 + T_IS / T.slow;                  // 直线那边的人挡到
T.kill = T.hit1 + 0.05 + BLK;                    // 同伴在网前封
T.killLand = T.kill + KILL / T.slow;
T.sm3 = 30.555 - DRV - T_IC;                     // 常见错误：抽直线落地对在 30.555（音乐 30.4–31.0 几乎无声）
T.contact = T.sm3 + T_IC;
T.land3 = T.contact + DRV;
window.TIMES = T;

// ---- 选项：三个落点（A 杀直线，B 杀斜线，C 打高远）----
const OPTS = [['A', A], ['B', B], ['C', C]];
const opts = {};
function buildOpts() {
  for (const [k, p] of OPTS) {
    const g = el('g', {}, $('opts'));
    const ring = el('circle', { cx: 0, cy: 0, r: 17, fill: 'none', 'stroke-width': 3, 'stroke-dasharray': '6 5' }, g);
    const txt = el('text', { x: 0, y: 47, 'text-anchor': 'middle', 'font-family': 'BLAB', 'font-weight': 700, 'font-size': 26 }, g);
    txt.textContent = k;
    opts[k] = { g, ring, txt, p };
  }
}
let M = {};
function buildMarks() {
  M = { okA: mark('ok', LIME, 12), noB: mark('no', WARM, 10), noC: mark('no', WARM, 10),
        ok1: mark('ok', LIME, 15), miss: mark('no', WARM, 17) };
}

// ---- 我们两个人（实心荧光绿点 + 朝向小三角 + 拍子）----
const PL = [];
function buildPlayers() {
  for (let i = 0; i < 2; i++) {
    const g = el('g', {}, $('players'));
    PL.push({ g, arm: el('line', { stroke: LIME, 'stroke-linecap': 'round' }, g), head: el('ellipse', { fill: 'none', stroke: LIME }, g),
              c: el('circle', { fill: LIME, filter: 'url(#g2)' }, g), w: el('polygon', { fill: LIME }, g) });
  }
}
function drawPlayer(o, st, rkOp) {
  const z = ZF(), mr = 13 * z;
  o.g.setAttribute('transform', `translate(${X(st.p[0])},${Y(st.p[1])})`);
  o.c.setAttribute('r', mr);
  const fa = st.face * Math.PI / 180;
  const wpt = (r, a) => `${Math.cos(fa + a) * r},${Math.sin(fa + a) * r}`;
  o.w.setAttribute('points', `${wpt(mr + 13 * z, 0)} ${wpt(mr + 4 * z, -0.42)} ${wpt(mr + 4 * z, 0.42)}`);
  const ra = st.rk * Math.PI / 180, rkPx = RK * CAM.s, headR = 0.13 * CAM.s;
  const armEnd = Math.max(mr + 2, rkPx - headR);
  o.arm.setAttribute('x1', Math.cos(ra) * mr); o.arm.setAttribute('y1', Math.sin(ra) * mr);
  o.arm.setAttribute('x2', Math.cos(ra) * armEnd); o.arm.setAttribute('y2', Math.sin(ra) * armEnd);
  o.arm.setAttribute('stroke-width', 3 * Math.sqrt(z));
  o.head.setAttribute('cx', Math.cos(ra) * rkPx); o.head.setAttribute('cy', Math.sin(ra) * rkPx);
  o.head.setAttribute('rx', headR); o.head.setAttribute('ry', headR * 0.72);
  o.head.setAttribute('transform', `rotate(${st.rk},${Math.cos(ra) * rkPx},${Math.sin(ra) * rkPx})`);
  o.head.setAttribute('stroke-width', 3 * Math.sqrt(z));
  o.arm.setAttribute('opacity', rkOp); o.head.setAttribute('opacity', rkOp);
}
function swing(t, at) { return t >= at - 0.12 && t < at + 0.5 ? Math.sin(Math.PI * clamp01((t - at + 0.12) / 0.62)) : 0; }
const FACE_M = angW(SM, [0, -3.5]);              // 我在后场朝着对方
const RK_UP = -45;                               // 准备杀球：拍子举在头上
// 我在 t 秒的状态
function meAt(t) {
  if (t >= T.loop) t = 0;
  const s = { p: ME0, face: -90, rk: -90 };
  if (t >= T.go[0]) {                                        // 球挑到左后场，退过去准备杀
    const k = tw(t, T.go[0], T.go[1], easeInOut);
    s.p = lerp2(ME0, SM, k); s.face = lerp(-90, FACE_M, k); s.rk = lerp(-90, RK_UP, k);
  }
  if (t >= T.sm1 + 0.3 && t < T.reset[0]) {                 // 杀完直线顺势往前跟一步
    const k = tw(t, T.sm1 + 0.3, T.sm1 + 1.1, easeInOut);
    s.p = lerp2(SM, [-1.85, 4.2], k); s.rk = lerp(RK_UP, -100, k);
  }
  if (t >= T.reset[0]) {
    const k = tw(t, T.reset[0], T.reset[1], easeInOut);
    s.p = lerp2([-1.85, 4.2], SM, k); s.rk = lerp(-100, RK_UP, k);
  }
  if (t >= T.sm3 + 0.15) {                                   // 杀完斜线，往右边追，来不及
    const k = tw(t, T.sm3 + 0.15, T.land3 + 0.05, easeInOut);
    s.p = lerp2(SM, ME3, k); s.face = lerp(FACE_M, angW(ME3, RD), k); s.rk = lerp(RK_UP, angW(ME3, RD) - 15, k);
  }
  if (t >= T.rule - 0.3) {                                   // 规则卡：回到后场，准备杀直线
    const k = tw(t, T.rule - 0.3, T.rule + 0.3, easeInOut);
    s.p = lerp2(ME3, SM, k); s.face = lerp(angW(ME3, RD), FACE_M, k); s.rk = lerp(angW(ME3, RD) - 15, RK_UP, k);
  }
  for (const at of [T.race, T.sm1, T.sm3]) { const w = swing(t, at); if (w > 0) s.rk = lerp(s.rk, -120, w); }
  return s;
}
function partnerAt(t) {
  if (t >= T.loop) t = 0;
  const s = { p: PA0, face: -90, rk: -90 };
  if (t >= T.go[0]) s.p = lerp2(PA0, PF, tw(t, T.go[0], T.go[1], easeInOut));   // 上网
  if (t >= T.go[1]) s.rk = lerp(-90, -105, tw(t, T.go[1] - 0.3, T.go[1]));       // 拍子举在胸前
  if (t >= T.hit1 + 0.1 && t < T.reset[0]) {                 // 他挡直线网前：同伴往左前一步封
    const k = tw(t, T.hit1 + 0.1, T.kill - 0.15, easeInOut);
    s.p = lerp2(PF, PK, k); s.face = lerp(-90, angW(PK, KP), k);
    s.rk = lerp(-105, angW(PK, KP), k);
    const w = swing(t, T.kill); if (w > 0) s.rk = lerp(s.rk, angW(PK, KP) + 35, w);
  }
  if (t >= T.reset[0]) {
    const k = tw(t, T.reset[0], T.reset[1], easeInOut);
    s.p = lerp2(PK, PF, k); s.face = lerp(angW(PK, KP), -90, k); s.rk = lerp(angW(PK, KP), -105, k);
  }
  if (t >= T.contact + 0.05) {                               // 抽直线从身后右边过去，转头看
    const k = tw(t, T.contact + 0.05, T.land3, easeOutCubic);
    s.face = lerp(-90, 10, k); s.rk = lerp(-105, -20, k);
  }
  if (t >= T.rule) {
    const k = tw(t, T.rule, T.rule + 0.5, easeInOut);
    s.face = lerp(10, -90, k); s.rk = lerp(-20, -105, k);
  }
  return s;
}

// ---- 对方两个人（橙色空心点，朝着我）----
function oppsAt(t) {
  if (t >= T.loop) t = 0;
  let ds = DS0, dc = DC0;
  if (t >= 0.4) { const k = tw(t, 0.4, 2.4, easeInOut); ds = lerp2(DS0, DS, k); dc = lerp2(DC0, DC, k); }   // 球挑到我们左边，他们一起往直线这边挪
  if (t >= T.sm3 + 0.05 && t < T.rule) dc = lerp2(DC, DC2, tw(t, T.sm3 + 0.05, T.contact - 0.05, easeInOut));   // 杀斜线：他一步就到
  if (t >= T.rule) dc = lerp2(DC2, DC, tw(t, T.rule, T.rule + 0.6, easeInOut));
  return [ds, dc];
}
const OPP = [];
function buildOpps() {
  for (let i = 0; i < 2; i++) {
    const g = el('g', {}, $('opps'));
    OPP.push({ g, c: el('circle', { fill: '#2A140C', stroke: WARM, filter: 'url(#g2)' }, g), w: el('polygon', { fill: WARM }, g),
               arm: el('line', { stroke: WARM, 'stroke-linecap': 'round', opacity: 0 }, g) });
  }
}
function drawOpp(o, p, hit, reach) {
  const z = ZF(), r = 14 * z * (1 + 0.25 * hit);
  const face = angW(p, SM);
  o.g.setAttribute('transform', `translate(${X(p[0])},${Y(p[1])})`);
  o.c.setAttribute('r', r); o.c.setAttribute('stroke-width', 4.5 * Math.sqrt(z));
  const fa = face * Math.PI / 180;
  const wpt = (rr, a) => `${Math.cos(fa + a) * rr},${Math.sin(fa + a) * rr}`;
  o.w.setAttribute('points', `${wpt(r + 13 * z, 0)} ${wpt(r + 4 * z, -0.42)} ${wpt(r + 4 * z, 0.42)}`);
  if (reach) {                                                 // 伸拍：一条短线指向球
    const a = Math.atan2(reach[1] - p[1], reach[0] - p[0]), L = Math.min(dist(p, reach), RK) * CAM.s;
    o.arm.setAttribute('x1', Math.cos(a) * r); o.arm.setAttribute('y1', Math.sin(a) * r);
    o.arm.setAttribute('x2', Math.cos(a) * L); o.arm.setAttribute('y2', Math.sin(a) * L);
    o.arm.setAttribute('stroke-width', 3 * Math.sqrt(z)); o.arm.setAttribute('opacity', reach[2]);
  } else o.arm.setAttribute('opacity', 0);
}

// ---- 球 ----
const hang = (op) => ({ p: SH, h: 2.8, fly: false, op });
function shuttle1(t) {
  if (t >= T.loop) t = 0;
  if (t < T.lobEnd) {                                      // 他们挑过来的高球：从高处落到我头顶
    const k = t / T.lobEnd, kk = 1 - (1 - k) ** 1.6;
    return { p: lerp2([-1.2, -0.6], SH, kk), h: lerp(4.5, 2.8, kk) + 3.2 * Math.sin(Math.PI * Math.min(1, 0.5 + kk * 0.5)), fly: true, op: 1 };
  }
  if (t < T.race) return hang(1);
  if (t < 11.0) {                                          // 两种杀球一起出手（0.5× 慢放），这是直线那颗
    const real = t < T.raceLandA ? (t - T.race) * T.slow : T_A;
    return { ...smashAt(SH, A, real, LEN_A), op: 1 - tw(t, 10.6, 10.9, lin) };
  }
  if (t < T.sm1) return hang(tw(t, 11.0, 11.3));
  if (t < T.reset[0]) {                                    // 演示：杀直线 → 他只能挡直线网前 → 同伴封网
    if (t < T.hit1) return { ...smashAt(SH, A, (t - T.sm1) * T.slow, LEN_A), op: 1 };
    if (t < T.kill) {
      const u = clamp01((t - T.hit1 - 0.05) / BLK), uu = easeOutCubic(u);
      return { p: lerp2(IS, KP, lerp(uu, u, 0.4)), h: lerp(smashH(F_IS), 1.25, u) + 1.1 * Math.sin(Math.PI * u), fly: true, op: 1 };
    }
    const k = clamp01((t - T.kill) / (KILL / T.slow));
    if (k < 1) return { p: lerp2(KP, KL, k), h: 1.6 * (1 - k), fly: true, op: 1 };
    return { p: KL, h: 0, fly: false, op: 1 - tw(t, 25.6, 26.0, lin) };
  }
  if (t < T.sm3) return hang(tw(t, T.reset[1], T.reset[1] + 0.3));
  if (t < T.rule) {                                        // 常见错误：杀斜线（真实速度），他一步接到，抽直线到空当
    if (t < T.contact) return { ...smashAt(SH, B, t - T.sm3, LEN_B), op: 1 };
    const k = clamp01((t - T.contact) / DRV);
    if (k < 1) return { p: lerp2(IC, RD, k), h: lerp(smashH(F_IC), 0, k ** 1.6) + 0.6 * Math.sin(Math.PI * k), fly: true, op: 1 };
    return { p: RD, h: 0, fly: false, op: 1 - tw(t, 30.7, 31.0, lin) };
  }
  if (t < T.end) return hang(tw(t, T.rule + 0.4, T.rule + 0.7));
  return null;
}
function shuttle2(t) {                                     // 只在“谁先到”那一段：斜线那颗
  if (t < T.race || t >= 11.0) return null;
  let real;
  if (t < T.raceLandA) real = (t - T.race) * T.slow;
  else if (t < T.raceResume) real = T_A;
  else real = T_A + (t - T.raceResume) * T.slow;
  return { ...smashAt(SH, B, real, LEN_B), op: 1 - tw(t, 10.6, 10.9, lin) };
}

// ---- 文字 ----
const LABEL_STYLE = { straight: 'lime', cross: 'pale', first: 'lime', front: 'warm', gap: 'warm', block: 'pale', kill: 'lime', early: 'warm' };
const SIZES = { zh: { title: 40, big: 84, sub: 56, card: 124 }, ja: { title: 38, big: 76, sub: 54, card: 110 },
                ko: { title: 36, big: 72, sub: 50, card: 104 }, en: { title: 32, big: 66, sub: 50, card: 98 } };
const CARD_Y = { c1: 800, c2: 800, c3: 800, c4: 790 };   // 卡片中心：对方中场和网之间，那几段时间这里没有动作
window.setup = function (spec, lang) {
  setupText(spec, lang, { sizes: SIZES, cardY: CARD_Y, bigY: 790, labelStyle: LABEL_STYLE });
  buildCourt('doubles'); court.tag.textContent = TX.tag; buildOpts(); buildMarks(); buildOpps(); buildPlayers(); buildShuttle('sh1'); buildShuttle('sh2'); setupImpact(spec);
  return { fonts: [...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family) };
};

// ---- 每一帧 ----
function dashLine(path, from, to, p, op, w, z) {
  const q = lerp2(from, to, clamp01(p));
  path.setAttribute('d', `M${X(from[0])},${Y(from[1])} L${X(q[0])},${Y(q[1])}`);
  path.setAttribute('opacity', p > 0 ? op : 0); path.setAttribute('stroke-width', w);
  path.style.strokeDasharray = `${10 * z} ${9 * z}`;
}
window.render = function (t) {
  const inLoop = t >= T.loop;
  const ts = impactWarp(inLoop ? 0 : t);          // 冲击停帧（JSON 没有 impact 时原样）
  CAM = camAt(t, MOVES);
  const z = ZF();
  const worldOp = inLoop ? tw(t, T.loop, T.dur - 0.05) : 1 - tw(t, T.end, T.end + 0.3);
  $('world').setAttribute('opacity', worldOp);
  drawCourt();

  // 对方：挡球、接杀时稍微放大一下，伸拍
  const [ds, dc] = oppsAt(ts);
  let h1 = 0, h2 = 0;
  if (ts >= T.hit1 && ts < T.hit1 + 0.3) h1 = 1 - (ts - T.hit1) / 0.3;
  if (ts >= T.contact && ts < T.contact + 0.3) h2 = 1 - (ts - T.contact) / 0.3;
  const r1 = ts >= T.hit1 - 0.35 && ts < T.hit1 + 0.6 ? [IS[0], IS[1], Math.min(tw(ts, T.hit1 - 0.35, T.hit1 - 0.1), 1 - tw(ts, T.hit1 + 0.3, T.hit1 + 0.6, lin))] : null;
  const r2 = ts >= T.contact - 0.2 && ts < T.contact + 0.5 ? [IC[0], IC[1], Math.min(tw(ts, T.contact - 0.2, T.contact - 0.05), 1 - tw(ts, T.contact + 0.25, T.contact + 0.5, lin))] : null;
  drawOpp(OPP[0], ds, h1, r1);
  drawOpp(OPP[1], dc, h2, r2);

  // 我们
  const me = meAt(ts), pa = partnerAt(ts);
  const rkOp = ts < T.go[1] - 0.3 ? 0.4 : 1;
  drawPlayer(PL[0], me, rkOp); drawPlayer(PL[1], pa, rkOp);

  // 两条杀球线：直线（荧光绿）、斜线（淡白）
  let sOp = 0, cOp = 0;
  if (ts >= T.drawS[0] && ts < T.missCard) {
    if (ts < 11.0) { sOp = 1; cOp = 0.85; }
    else if (ts < T.reveal) { sOp = 0.25; cOp = 0.6; }
    else if (ts < T.aLit[0]) { sOp = 0.3; cOp = 0.2; }
    else if (ts < T.sm1 + 1.5) { sOp = lerp(0.3, 1, tw(ts, T.aLit[0], T.aLit[1])); cOp = 0.15; }
    else { sOp = 0.35; cOp = 0.12; }
    const f = 1 - tw(ts, T.missCard - 0.4, T.missCard, lin); sOp *= f; cOp *= f;
  }
  if (ts >= T.sm3 - 0.4 && ts < T.rule) cOp = 0.5 * tw(ts, T.sm3 - 0.4, T.sm3) * (1 - tw(ts, T.contact, T.contact + 0.3));
  if (ts >= T.rule) { sOp = tw(ts, T.rule + 0.3, T.rule + 0.8); cOp = 0; }
  const lw = 4.5 * Math.sqrt(z);
  setLine($('pStraight'), SH, A, ts >= T.rule ? 1 : tw(ts, T.drawS[0], T.drawS[1], easeInOut), sOp, lw);
  setLine($('pCross'), SH, B, ts >= T.sm3 - 0.4 ? 1 : tw(ts, T.drawC[0], T.drawC[1], easeInOut), cOp, lw * 0.85);
  const s2 = shuttle2(ts);
  if (s2 && ts >= T.raceLandA && ts < T.raceResume + 0.3) {   // 直线落地时，斜线那颗还差的一段
    const rOp = Math.min(tw(ts, T.raceLandA, T.raceLandA + 0.15), 1 - tw(ts, T.raceResume, T.raceResume + 0.3));
    $('pRemain').setAttribute('d', `M${X(s2.p[0])},${Y(s2.p[1])} L${X(B[0])},${Y(B[1])}`);
    $('pRemain').setAttribute('opacity', rOp); $('pRemain').setAttribute('stroke-width', lw);
    $('pRemain').setAttribute('stroke-dasharray', `${2 * z} ${12 * z}`);
  } else $('pRemain').setAttribute('opacity', 0);

  // 反转：斜线那边的人站得更前；他接到后抽直线，落在我们右边的空当（橙色虚线 + 一块空当）
  const rw = 4 * Math.sqrt(z);
  let dP = 0, dOp = 0;
  if (ts >= T.rev && ts < T.reveal) { dP = tw(ts, T.rev + 0.9, T.rev + 1.6, easeInOut); dOp = 0.9 * (1 - tw(ts, 14.6, 15.0, lin)); }
  dashLine($('pDrive'), IC, RD, dP, dOp, rw, z);
  const gv = Math.max(vis(ts, T.rev + 1.4, 14.7, 0.4, 0.4), vis(ts, T.land3 - 0.1, T.rule, 0.2, 0.3));
  const gb = $('gapBand');
  gb.setAttribute('cx', X(RD[0] - 0.2)); gb.setAttribute('cy', Y(RD[1]));
  gb.setAttribute('rx', 0.95 * CAM.s); gb.setAttribute('ry', 1.15 * CAM.s);
  gb.setAttribute('opacity', gv); gb.setAttribute('stroke-width', 2.5 * Math.sqrt(z));
  gb.setAttribute('stroke-dasharray', `${8 * z} ${8 * z}`);

  // 常见错误：我追过去还差的一段（橙色虚线）
  const lv = vis(ts, T.land3, T.rule, 0.15, 0.25);
  setSeg($('lunge'), X(me.p[0]), Y(me.p[1]), X(RD[0]), Y(RD[1]), lv, 4 * Math.sqrt(z));
  $('lunge').setAttribute('stroke-dasharray', `${2 * z} ${11 * z}`);

  // 场景里的小标签：每次最多两个
  if (!inLoop) {
    const pS = onLine(A, -2.0), pC = onLine(B, -2.0);
    placeLabel('straight', ts, 6.3, 8.7, X(pS[0]) - 22, Y(pS[1]), 'r');
    placeLabel('cross', ts, 6.6, 8.7, X(pC[0]) + 24, Y(pC[1]), 'l');
    placeLabel('first', ts, T.raceLandA, 10.1, X(A[0]) + 26 * z, Y(A[1]) - 10 * z, 'l');
    placeLabel('front', ts, T.rev + 0.2, 14.7, X(DC[0]) + 30 * z, Y(DC[1]) - 4 * z, 'l');
    placeLabel('gap', ts, ts < 20 ? T.rev + 1.6 : T.land3 + 0.05, ts < 20 ? 14.7 : T.rule, X(RD[0]) - 10 * z, Y(RD[1]) + 58 * z, 'c');
    placeLabel('block', ts, T.hit1 + 0.1, T.kill, X(DS[0]) + 30 * z, Y(DS[1]) + 6 * z, 'l');
    placeLabel('kill', ts, T.kill + 0.1, 26.4, X(PK[0]) + 34 * z, Y(PK[1]) + 6 * z, 'l');
    placeLabel('early', ts, T.contact - 0.35, T.rule, X(DC2[0]), Y(DC2[1]) - 52 * z, 'c');
  } else hideLabels();

  // 选项圈（A 对）
  for (const [i, [k]] of OPTS.entries()) {
    const o = opts[k], t0 = T.opt[i];
    const sc = ts < t0 ? 0 : easeOutBack(clamp01((ts - t0) / 0.3));
    let oo = ts < t0 ? 0 : Math.min(1, (ts - t0) / 0.15);
    if (ts >= 5.0 && ts < T.reveal) oo *= lerp(1, 0.3, tw(ts, 5.0, 5.4));
    oo *= 1 - tw(ts, 18.2, 18.6);
    const right = k === 'A', rv2 = ts >= T.reveal;
    const col = rv2 ? (right ? LIME : WARM) : PALE;
    if (rv2 && !right) oo *= 0.6;
    const pop = rv2 && right ? 1 + 0.25 * (1 - tw(ts, T.reveal, T.reveal + 0.4)) : 1;
    o.ring.setAttribute('stroke', col);
    o.ring.setAttribute('stroke-dasharray', rv2 && right ? 'none' : '6 5');
    o.ring.setAttribute('stroke-width', rv2 && right ? 4 : 3);
    o.ring.setAttribute('filter', rv2 && right ? 'url(#g1)' : 'none');
    o.txt.setAttribute('fill', col);
    o.g.setAttribute('transform', `translate(${X(o.p[0])},${Y(o.p[1])}) scale(${Math.max(0.001, sc * pop * z)})`);
    o.g.setAttribute('opacity', oo);
  }
  // 勾和叉
  showMark(M.okA, X(A[0]) + 26 * z, Y(A[1]) - 22 * z, ts, T.reveal, 17.9);
  showMark(M.noB, X(B[0]) - 26 * z, Y(B[1]) - 22 * z, ts, T.reveal + 0.07, 17.9);
  showMark(M.noC, X(C[0]) + 34 * z, Y(C[1]) + 4 * z, ts, T.reveal + 0.13, 17.9);
  showMark(M.ok1, X(KL[0]) + 34 * z, Y(KL[1]) - 26 * z, ts, T.killLand, 26.4);
  showMark(M.miss, X(RD[0]) - 40 * z, Y(RD[1]) - 34 * z, ts, T.land3 + 0.1, T.rule - 0.2);
  pulse($('pulse1'), ts < 15 ? A : KL, ts, ts < 15 ? T.raceLandA : T.killLand);
  pulse($('pulse2'), RD, ts, T.land3);

  drawShuttle('sh1', shuttle1, ts);
  drawShuttle('sh2', shuttle2, ts);
  renderImpact(ts, shuttle1, inLoop ? -1 : t);   // 冲击效果（JSON 没有 impact 时什么都不画）

  renderText(t, CAP_TOP);
};
</script>
