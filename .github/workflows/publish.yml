# 每天做出到期的视频，通过 Buffer 发到品牌账号（Instagram、TikTok、YouTube）。
# 发什么、哪天发：content/schedule.json。
name: Publish
on:
  schedule:
    - cron: "30 1 * * *"   # 洛杉矶傍晚 5:30（冬令时）
  workflow_dispatch:
  # 视频先停了（2026-11-12）。恢复时再加回 push 触发。
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: video/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 字体和系统依赖
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk sox libsndfile1
      - name: Python 依赖（CPU 版 torch）
        run: |
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r video/requirements.txt
      - name: 截图用的浏览器
        working-directory: video
        run: npm install --no-fund --no-audit && npx playwright install --with-deps chromium
      - name: 配音模型缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-tts-1.7b-base
      - name: 做视频并发布
        run: python publish/run.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
